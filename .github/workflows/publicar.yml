name: Publicar Run Scooter (APK + GitHub Pages)
on:
  push:
    branches: [ccr-cbc7f0af-0306uo, main]
    paths: ['web/**', 'apk/**', '.github/workflows/publicar.yml', 'tools/verify.mjs']
  workflow_dispatch:
concurrency: { group: publicar, cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Proyecto Capacitor
        run: |
          mkdir -p cap/www && cp -r web/. cap/www/ && rm -f cap/www/sw.js cap/www/RunScooter.apk
          cd cap && npm init -y >/dev/null
          npm i --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7
          echo '{"appId":"com.juanfeliperico.runscooter","appName":"Run Scooter","webDir":"www","android":{"backgroundColor":"#0e6378"}}' > capacitor.config.json
          npx cap add android && npx cap sync android
      - name: Íconos y orientación vertical
        run: |
          cd cap && mkdir -p assets && cp ../apk/*.png assets/
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#0e6378' --iconBackgroundColorDark '#0e6378' --splashBackgroundColor '#f3efe0' --splashBackgroundColorDark '#0e6378' || echo "aviso: no se generaron íconos"
          sed -i '0,/<activity/s//<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
      - name: Compilar APK
        run: cd cap/android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon -q
      - run: cp cap/android/app/build/outputs/apk/debug/app-debug.apk RunScooter.apk && ls -la RunScooter.apk
      - uses: actions/upload-artifact@v4
        with: { name: RunScooter-apk, path: RunScooter.apk, retention-days: 30 }
  pages:
    needs: apk
    runs-on: ubuntu-latest
    permissions: { contents: write, pages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: RunScooter-apk, path: apkout }
      - name: Subir a la rama gh-pages
        run: |
          mkdir site && cp -r web/. site/ && cp apkout/RunScooter.apk site/ && touch site/.nojekyll && echo "${{ github.sha }}" > site/version.txt
          cd site && git init -q -b gh-pages && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Publicar Run Scooter ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
      - name: Activar Pages desde gh-pages
        continue-on-error: true
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" || gh api -X PUT "repos/${{ github.repository }}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" || true
          sleep 5; gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          gh api "repos/${{ github.repository }}/pages" || true
  verificar:
    needs: pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save --no-audit --no-fund playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Esperar a que el enlace publique esta versión
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          for i in $(seq 1 60); do v=$(curl -fsSL "${URL}version.txt?t=$i" 2>/dev/null || true); [ "$v" = "${{ github.sha }}" ] && echo "publicado ($i)" && exit 0; sleep 10; done; echo "no publicó a tiempo"; exit 1
      - name: Verificar carga, service worker, modo sin conexión e instalabilidad
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          node tools/verify.mjs "$URL" | tee resultado.json
          { echo '### Verificación de '"$URL"; echo '```json'; cat resultado.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
